<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/dataTables.bootstrap4.min.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/5.5.2/bootbox.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/dataTables.bootstrap4.min.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/item.js"></script>
  </head>
  <body>
    <div id="home"></div>
    <div id="items" class="container">
      <button type="button" class="btn btn-info btn-lg" data-toggle="modal" data-target="#itemModal">Add Item</button>
      <div class="table-responsive mt-3">
        <table id="itable" class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Description</th>
              <th>Buy Price</th>
              <th>Sell Price</th>
              <th>Stock</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ibody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="itemModal" role="dialog" style="display: none">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">Item Form</h4>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <form id="iform">
              <input type="hidden" id="itemId" name="item_id" />
              <div class="form-group">
                <label for="itemName" class="control-label">Name</label>
                <input type="text" class="form-control" id="itemName" name="name" />
              </div>
              <div class="form-group">
                <label for="itemDescription" class="control-label">Description</label>
                <input type="text" class="form-control" id="itemDescription" name="description" />
              </div>
              <div class="form-group">
                <label for="itemBrand" class="control-label">Brand</label>
                <input type="text" class="form-control" id="itemBrand" name="brand" />
              </div>
              <div class="form-group">
                <label for="itemBuyPrice" class="control-label">Buy Price</label>
                <input type="number" step="0.01" class="form-control" id="itemBuyPrice" name="buy_price" />
              </div>
              <div class="form-group">
                <label for="itemSellPrice" class="control-label">Sell Price</label>
                <input type="number" step="0.01" class="form-control" id="itemSellPrice" name="sell_price" />
              </div>
              <div class="form-group">
                <label for="itemStock" class="control-label">Stock</label>
                <input type="number" class="form-control" id="itemStock" name="stock" />
              </div>
              <div class="form-group">
                <label for="itemCategoryId" class="control-label">Category ID</label>
                <input type="number" class="form-control" id="itemCategoryId" name="category_id" value="1" />
              </div>
              <div class="form-group">
                <label for="itemImage" class="control-label">Images</label>
                <input type="file" class="form-control" id="itemImageInput" name="images" multiple accept=".jpg,.jpeg,.png" />
                <div id="itemImagePreviews" class="mt-2"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <button id="itemSubmit" type="submit" class="btn btn-primary">Save</button>
            <button id="itemUpdate" type="submit" class="btn btn-primary">Update</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
