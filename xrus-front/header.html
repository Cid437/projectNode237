<header class="site-header mb-4">
  <div class="header-top py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="brand-left d-flex align-items-center">
        <a class="navbar-brand d-flex align-items-center" href="home.html">
          <span class="logo-main">Xrus</span>
          <span class="ml-2 logo-sub" style="margin-left:8px;">Timepieces</span>
        </a>
      </div>
      <div class="header-icons d-flex align-items-center">
        <!-- cart icon removed per request -->
        <!-- Account icon replaces Login/Register text links -->
        <a id="accountLink" class="nav-icon" href="login.html" title="Account"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </div>

  <!-- Search removed per request -->

  <nav class="header-nav">
    <div class="container d-flex align-items-start justify-content-between">
      <ul class="nav justify-content-start">
        <li class="nav-item active">
          <a class="nav-link" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cart.html">Cart</a>
        </li>
        <li class="nav-item admin-only" style="display:none">
          <a class="nav-link" href="orders.html">Orders</a>
        </li>
        <li class="nav-item auth-only" style="display:none">
          <a class="nav-link" href="purchases.html">My Purchases</a>
        </li>
        <li class="nav-item admin-only" style="display:none">
          <a class="nav-link" href="item.html">Items</a>
        </li>
        <li class="nav-item admin-only" style="display:none">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
        </li>
        <li class="nav-item admin-only" style="display:none">
          <a class="nav-link" href="users.html">Users</a>
        </li>
        <!-- Login/Register text links removed; use account icon at top-right -->
      </ul>
      <div class="header-logout ml-3" style="align-self:flex-end;">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm" style="display:none">Logout</button>
      </div>
    </div>
  </nav>
</header>
<script>
  (function applyHeaderState() {
    const role = (sessionStorage.getItem('role') || 'customer').toLowerCase();
    const token = sessionStorage.getItem('token');
    const userId = sessionStorage.getItem('userId');
    const isLoggedIn = Boolean(token && userId);

    document.querySelectorAll('.admin-only').forEach(function (el) {
      el.style.display = role === 'admin' ? '' : 'none';
    });

    document.querySelectorAll('.auth-only').forEach(function (el) {
      el.style.display = isLoggedIn ? '' : 'none';
    });

    document.querySelectorAll('.guest-only').forEach(function (el) {
      el.style.display = isLoggedIn ? 'none' : '';
    });

    const accountLink = document.getElementById('accountLink');
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      if (isLoggedIn) {
        logoutBtn.style.display = '';
        logoutBtn.onclick = function (e) {
          e.preventDefault();
          sessionStorage.clear();
          window.location.href = 'login.html';
        };
      } else {
        logoutBtn.style.display = 'none';
        logoutBtn.onclick = null;
      }
    }

    if (accountLink) {
      if (isLoggedIn) {
        // when logged in, account icon goes to profile
        accountLink.href = 'profile.html';
        accountLink.title = 'Profile';
        accountLink.onclick = null;
      } else {
        accountLink.href = 'login.html';
        accountLink.title = 'Login / Register';
        accountLink.onclick = null;
      }
    }
  })();
</script>
