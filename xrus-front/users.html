<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"></script>
    <script src="js/users.js"></script>
  </head>
  <body>
    <div id="home"></div>
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>User Management</h2>
        <button class="btn btn-primary" id="addUserBtn">Add User</button>
      </div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">User Form</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <form id="userForm">
              <input type="hidden" id="userId" />
              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" id="userFirstName" />
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" id="userLastName" />
              </div>
              <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" id="userUsername" />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" id="userEmail" />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" id="userPassword" />
              </div>
              <div class="form-group">
                <label>Role</label>
                <select class="form-control" id="userRole">
                  <option value="customer">Customer</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="form-group">
                <label>Status</label>
                <select class="form-control" id="userStatus">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" id="saveUserBtn">Save</button>
            <button type="button" class="btn btn-primary" id="updateUserBtn">Update</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
