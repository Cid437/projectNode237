<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <h1>Admin Dashboard</h1>
    <div id="adminMessage" style="margin-bottom: 16px; color: red;"></div>
    <div id="adminCurrentUser" style="margin-bottom: 16px; font-weight: bold;"></div>

    <section>
      <h2>Users</h2>
      <form id="userForm">
        <input type="hidden" id="userId">
        <input type="text" id="userName" placeholder="Name" required>
        <input type="email" id="userEmail" placeholder="Email" required>
        <input type="password" id="userPassword" placeholder="Password">
        <select id="userRole" required>
          <option value="">Select Role</option>
          <option value="admin">Admin</option>
          <option value="user">User</option>
          <option value="guest">Guest</option>
        </select>
        <button type="submit" id="userSubmitBtn">Create User</button>
        <button type="button" id="cancelUserEditBtn" style="display:none;">Cancel Edit</button>
      </form>
      <table id="adminUsersTable" border="1">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Items</h2>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <input type="text" id="itemName" placeholder="Name" required>
        <input type="text" id="itemDescription" placeholder="Description" required>
        <input type="number" id="itemPrice" placeholder="Price" required>
        <input type="number" id="itemStock" placeholder="Stock" required>
        <input type="number" id="itemCategory" placeholder="Category ID">
        <button type="submit" id="itemSubmitBtn">Create Item</button>
        <button type="button" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
      </form>
      <table id="adminItemsTable" border="1">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Orders</h2>
      <table id="adminOrdersTable" border="1">
        <thead>
          <tr><th>ID</th><th>User ID</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
