<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Items</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>

<h1>Items</h1>

<div id="items"></div>

<script>

$(function(){

$("#header").load("header.html");

$.get("/api/items",function(data){

let html="";

data.forEach(item=>{

html+=`
<div>
<h3>${item.name}</h3>
<p>${item.price}</p>
<button>Add to Cart</button>
</div>
`;

});

$("#items").html(html);

});

});

</script>

</body>
</html>
